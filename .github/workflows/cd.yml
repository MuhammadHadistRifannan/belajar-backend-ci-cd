name: CD - Deploy to VPS (Docker)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Add SSH known hosts
      run: |
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS
      run: |
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

          cd /home/dotnet || exit 1

          if [ ! -d ".git" ]; then
            git clone https://github.com/MuhammadHadistRifannan/belajar-backend-ci-cd.git .
          else
            git pull origin main
          fi

          docker rm -f belajar-cicd-app || true
          docker build -t belajar-cicd-app .
          docker run -d -p 5071:5071 --name belajar-cicd-app belajar-cicd-app
        EOF
